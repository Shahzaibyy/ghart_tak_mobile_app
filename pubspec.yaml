name: attock_xpress
description: Bhook Lagi customer and rider apps for Attock District.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.2
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  google_maps_flutter: ^2.18.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#D96B41"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#D96B41"
    theme_color: "#D96B41"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_dark.svg
    - assets/branding/logo_light.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/Phosphor-Duotone.ttf
